<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio06</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>Conversor de Temperatura</h1>
    <button class="btn">converter</button>

    <script>
        var btn = document.querySelector('.btn');
        btn.addEventListener('click', function(){
            var celsius = prompt('Digite a temperatura em Celsius:');
            var fahrenheit = (celsius * 9/5) + 32; 
            var kelvin = parseFloat(celsius) + 273.15;
            alert('Temperatura em Fahrenheit: ' + fahrenheit.toFixed(2) + '°F\n' +
                  'Temperatura em Kelvin: ' + kelvin.toFixed(2) + 'K');
        });
    </script>
</body>
</html>
