<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio07</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <h1>Conversor de Moedas</h1>
    <button class="btn">converter</button>

    <script>
        var btn = document.querySelector('.btn');
        btn.addEventListener('click', function(){
            var dolar = prompt('Qual a cotaçao do dólar atualmente:');
            var real = prompt('Quantos reais você tem?');
            var conversao = real / dolar;
            alert('Você tem $' + conversao.toFixed(2) + ' dólares');
        });
    </script>
</body>
</html>
