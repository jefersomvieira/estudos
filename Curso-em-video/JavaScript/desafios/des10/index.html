<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desafio10</title>
</head>
<body>
    <h1>Resolvendo bhaskara</h1>
    <button onclick="inicio()">Calcular</button>
    <p id="mensagem">Considerando uma equação no formato ax² + bx + c = 0, aperte o botao acima</p>
    <script>
        function inicio() {
            let a = parseFloat(prompt("Digite o valor de a:"));
            let b = parseFloat(prompt("Digite o valor de b:"));
            let c = parseFloat(prompt("Digite o valor de c:"));

            let delta = b * b - 4 * a * c;

            let resultado = document.getElementById("mensagem");
            resultado.innerHTML = `A equação atual é ${a}x² + ${b}x + ${c} = 0<br> O calculo realizado sera delta = ${b}² - 4 * ${a} * ${c} <br> O valor de delta é: ${delta}<br>`;
        }
    </script>
</body>
</html>
